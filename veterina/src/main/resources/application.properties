spring.application.name=veterina
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:oradb.fri.uniza.sk}:${DB_PORT:1521}/${DB_SERVICE:orclpdb.fri.uniza.sk}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=8080

# EU Veterinary Product Database - query endpoint returning XLSX results.
# The {query} segment is replaced with the searched medicine name.
veterinary.api-url=${VETERINARY_API_URL:https://medicines.health.europa.eu/veterinary/en/search-medicines/{query}}
