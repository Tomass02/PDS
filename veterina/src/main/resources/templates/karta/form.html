<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Zdravotna karta</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header(${item == null ? 'Nova zdravotna karta' : 'Upravit zdravotnu kartu'})}"></div><main><div class="card"><form class="grid" method="post" th:action="${item == null} ? @{/karty} : @{/karty/{id}(id=${item.idZdravotnaKarta})}">
<div class="field"><label>Zviera</label><select name="idZviera" required><option th:each="o:${zvierata}" th:value="${o.id}" th:text="${o.label}" th:selected="${item != null and item.idZviera == o.id}"></option></select></div><div class="field"><label>Datum zalozenia</label><input type="date" name="datumZalozenia" required th:value="${item?.datumZalozenia}"></div>
<div class="field full"><label>Poznamka</label><textarea name="poznamka" th:text="${item?.poznamka}"></textarea></div><div class="form-actions"><button class="btn">Ulozit</button><a class="btn secondary" href="/karty">Spat</a></div></form></div></main></body></html>
