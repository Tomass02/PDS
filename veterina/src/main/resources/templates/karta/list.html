<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Zdravotne karty</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header('Zdravotne karty')}"></div><div th:replace="~{fragments :: messages}"></div><main><p><a class="btn" href="/karty/new">Pridat kartu</a></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Zviera</th><th>Datum zalozenia</th><th>Poznamka</th><th>Akcie</th></tr></thead><tbody>
<tr th:each="x:${items}"><td th:text="${x.idZdravotnaKarta}"></td><td th:text="${x.zviera}"></td><td th:text="${x.datumZalozenia}"></td><td th:text="${x.poznamka}"></td><td><div class="actions"><a class="btn secondary" th:href="@{/karty/{id}/edit(id=${x.idZdravotnaKarta})}">Upravit</a><form th:action="@{/karty/{id}/delete(id=${x.idZdravotnaKarta})}" method="post"><button class="btn danger">Zmazat</button></form></div></td></tr>
</tbody></table></div></main></body></html>
