<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Polozka faktury</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header(${item == null ? 'Nova polozka faktury' : 'Upravit polozku faktury'})}"></div><main><div class="card"><form class="grid" method="post" th:action="${item == null} ? @{/polozky} : @{/polozky/{id}(id=${item.idPolozkaFaktury})}">
<div class="field"><label>Faktura</label><select name="idFaktura" required><option th:each="o:${faktury}" th:value="${o.id}" th:text="${o.label}" th:selected="${item != null and item.idFaktura == o.id}"></option></select></div><div class="field"><label>Nazov</label><input name="nazov" required th:value="${item?.nazov}"></div>
<div class="field"><label>Mnozstvo</label><input type="number" step="0.01" name="mnozstvo" th:value="${item?.mnozstvo}"></div><div class="field"><label>Jednotkova cena</label><input type="number" step="0.01" name="jednotkovaCena" th:value="${item?.jednotkovaCena}"></div><div class="field"><label>Sadzba DPH</label><input type="number" step="0.01" name="sadzbaDph" th:value="${item?.sadzbaDph}"></div>
<div class="form-actions"><button class="btn">Ulozit</button><a class="btn secondary" href="/polozky">Spat</a></div></form></div></main></body></html>
