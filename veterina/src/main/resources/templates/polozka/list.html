<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Polozky faktury</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header('Polozky faktury')}"></div><main><p><a class="btn" href="/polozky/new">Pridat polozku</a></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Faktura</th><th>Nazov</th><th>Mnozstvo</th><th>Jednotkova cena</th><th>DPH</th><th>Akcie</th></tr></thead><tbody>
<tr th:each="x:${items}"><td th:text="${x.idPolozkaFaktury}"></td><td th:text="${x.faktura}"></td><td th:text="${x.nazov}"></td><td th:text="${x.mnozstvo}"></td><td th:text="${x.jednotkovaCena}"></td><td th:text="${x.sadzbaDph}"></td><td><div class="actions"><a class="btn secondary" th:href="@{/polozky/{id}/edit(id=${x.idPolozkaFaktury})}">Upravit</a><form th:action="@{/polozky/{id}/delete(id=${x.idPolozkaFaktury})}" method="post"><button class="btn danger">Zmazat</button></form></div></td></tr>
</tbody></table></div></main></body></html>
