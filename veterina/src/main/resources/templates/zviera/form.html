<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Zviera</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header(${item == null ? 'Nove zviera' : 'Upravit zviera'})}"></div><main><div class="card"><form class="grid" method="post" enctype="multipart/form-data" th:action="${item == null} ? @{/zvierata} : @{/zvierata/{id}(id=${item.idZviera})}">
<div class="field"><label>Majitel</label><select name="idMajitel" required><option th:each="o:${majitelia}" th:value="${o.id}" th:text="${o.label}" th:selected="${item != null and item.idMajitel == o.id}"></option></select></div><div class="field"><label>Meno</label><input name="meno" required th:value="${item?.meno}"></div>
<div class="field"><label>Druh</label><input name="druh" required th:value="${item?.druh}"></div><div class="field"><label>Datum narodenia</label><input type="date" name="datumNarodenia" required th:value="${item?.datumNarodenia}"></div>
<div class="field"><label>Plemeno</label><input name="plemeno" th:value="${item?.plemeno}"></div><div class="field"><label>Fotografia (BLOB)</label><input type="file" name="fotografia" accept="image/*"><small th:if="${item != null and item.maFotografiu}">Aktualna fotografia je ulozena. Bez noveho suboru sa nezmeni.</small></div>
<div class="form-actions"><button class="btn">Ulozit</button><a class="btn secondary" href="/zvierata">Spat</a></div></form></div></main></body></html>
