<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Zvierata</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header('Zvierata')}"></div><div th:replace="~{fragments :: messages}"></div><main><p><a class="btn" href="/zvierata/new">Pridat zviera</a></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Majitel</th><th>Meno</th><th>Druh</th><th>Narodene</th><th>Plemeno</th><th>Foto</th><th>Akcie</th></tr></thead><tbody>
<tr th:each="x:${items}"><td th:text="${x.idZviera}"></td><td th:text="${x.majitel}"></td><td th:text="${x.meno}"></td><td th:text="${x.druh}"></td><td th:text="${x.datumNarodenia}"></td><td th:text="${x.plemeno}"></td><td th:text="${x.maFotografiu ? 'ano' : 'nie'}"></td><td><div class="actions"><a class="btn secondary" th:href="@{/zvierata/{id}/edit(id=${x.idZviera})}">Upravit</a><form th:action="@{/zvierata/{id}/delete(id=${x.idZviera})}" method="post"><button class="btn danger">Zmazat</button></form></div></td></tr>
</tbody></table></div></main></body></html>
