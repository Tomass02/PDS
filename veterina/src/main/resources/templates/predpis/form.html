<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Predpis</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header(${item == null ? 'Novy predpis' : 'Upravit predpis'})}"></div><main><div class="card"><form class="grid" method="post" th:action="${item == null} ? @{/predpisy} : @{/predpisy/{id}(id=${item.idPredpis})}">
<div class="field"><label>Vysetrenie</label><select name="idVysetrenie" required><option th:each="o:${vysetrenia}" th:value="${o.id}" th:text="${o.label}" th:selected="${item != null and item.idVysetrenie == o.id}"></option></select></div><div class="field"><label>Nazov lieku</label><input name="nazovLieku" required th:value="${item?.nazovLieku}"></div>
<div class="field"><label>Datum od</label><input type="date" name="datumOd" th:value="${item?.datumOd}"></div><div class="field"><label>Datum do</label><input type="date" name="datumDo" th:value="${item?.datumDo}"></div><div class="field full"><label>Poznamka</label><textarea name="poznamka" th:text="${item?.poznamka}"></textarea></div>
<div class="form-actions"><button class="btn">Ulozit</button><a class="btn secondary" href="/predpisy">Spat</a></div></form></div></main></body></html>
