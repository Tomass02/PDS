<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Predpisy</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header('Predpisy')}"></div><main><p><a class="btn" href="/predpisy/new">Pridat predpis</a></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Vysetrenie</th><th>Liek</th><th>Datum od</th><th>Datum do</th><th>Poznamka</th><th>Akcie</th></tr></thead><tbody>
<tr th:each="x:${items}"><td th:text="${x.idPredpis}"></td><td th:text="${x.vysetrenie}"></td><td th:text="${x.nazovLieku}"></td><td th:text="${x.datumOd}"></td><td th:text="${x.datumDo}"></td><td th:text="${x.poznamka}"></td><td><div class="actions"><a class="btn secondary" th:href="@{/predpisy/{id}/edit(id=${x.idPredpis})}">Upravit</a><form th:action="@{/predpisy/{id}/delete(id=${x.idPredpis})}" method="post"><button class="btn danger">Zmazat</button></form></div></td></tr>
</tbody></table></div></main></body></html>
