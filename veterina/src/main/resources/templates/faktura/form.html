<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Faktura</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header(${item == null ? 'Nova faktura' : 'Upravit fakturu'})}"></div><main><div class="card"><form class="grid" method="post" enctype="multipart/form-data" th:action="${item == null} ? @{/faktury} : @{/faktury/{id}(id=${item.idFaktura})}">
<div class="field"><label>Vysetrenie</label><select name="idVysetrenie" required><option th:each="o:${vysetrenia}" th:value="${o.id}" th:text="${o.label}" th:selected="${item != null and item.idVysetrenie == o.id}"></option></select></div><div class="field"><label>Suma celkom</label><input type="number" step="0.01" name="sumaCelkom" required th:value="${item?.sumaCelkom}"></div>
<div class="field"><label>Datum vystavenia</label><input type="date" name="datumVystavenia" required th:value="${item?.datumVystavenia}"></div><div class="field"><label>Datum splatnosti</label><input type="date" name="datumSplatnosti" required th:value="${item?.datumSplatnosti}"></div>
<div class="field"><label>Stav uhrady</label><input name="stavUhrady" th:value="${item?.stavUhrady}"></div><div class="field"><label>Scan faktury (BLOB)</label><input type="file" name="scanFaktury"><small th:if="${item != null and item.maScan}">Aktualny scan je ulozeny. Bez noveho suboru sa nezmeni.</small></div>
<div class="form-actions"><button class="btn">Ulozit</button><a class="btn secondary" href="/faktury">Spat</a></div></form></div></main></body></html>
