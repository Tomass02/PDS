<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Faktury</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header('Faktury')}"></div><div th:replace="~{fragments :: messages}"></div><main><p><a class="btn" href="/faktury/new">Pridat fakturu</a></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Vysetrenie</th><th>Suma</th><th>Vystavenie</th><th>Splatnost</th><th>Stav</th><th>Scan</th><th>Akcie</th></tr></thead><tbody>
<tr th:each="x:${items}"><td th:text="${x.idFaktura}"></td><td th:text="${x.vysetrenie}"></td><td th:text="${x.sumaCelkom}"></td><td th:text="${x.datumVystavenia}"></td><td th:text="${x.datumSplatnosti}"></td><td th:text="${x.stavUhrady}"></td><td th:text="${x.maScan ? 'ano' : 'nie'}"></td><td><div class="actions"><a class="btn secondary" th:href="@{/faktury/{id}/edit(id=${x.idFaktura})}">Upravit</a><form th:action="@{/faktury/{id}/delete(id=${x.idFaktura})}" method="post"><button class="btn danger">Zmazat</button></form></div></td></tr>
</tbody></table></div></main></body></html>
