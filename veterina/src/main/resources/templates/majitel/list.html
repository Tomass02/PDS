<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Majitelia</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header('Majitelia')}"></div><div th:replace="~{fragments :: messages}"></div><main><p><a class="btn" href="/majitelia/new">Pridat majitela</a></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Osoba</th><th>Ulica</th><th>Mesto</th><th>PSC</th><th>Stat</th><th>Akcie</th></tr></thead><tbody>
<tr th:each="x:${items}"><td th:text="${x.idMajitel}"></td><td th:text="${x.osoba}"></td><td th:text="${x.ulica}"></td><td th:text="${x.mesto}"></td><td th:text="${x.psc}"></td><td th:text="${x.stat}"></td><td><div class="actions"><a class="btn secondary" th:href="@{/majitelia/{id}/edit(id=${x.idMajitel})}">Upravit</a><form th:action="@{/majitelia/{id}/delete(id=${x.idMajitel})}" method="post"><button class="btn danger">Zmazat</button></form></div></td></tr>
</tbody></table></div></main></body></html>
