<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Vysetrenia</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header('Vysetrenia')}"></div><div th:replace="~{fragments :: messages}"></div><main><p><a class="btn" href="/vysetrenia/new">Pridat vysetrenie</a></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Zviera</th><th>Veterinar</th><th>Datum/cas</th><th>Diagnoza</th><th>Teplota</th><th>Tep</th><th>Hmotnost</th><th>Zavaznost</th><th>Akcie</th></tr></thead><tbody>
<tr th:each="x:${items}"><td th:text="${x.idVysetrenie}"></td><td th:text="${x.zviera}"></td><td th:text="${x.veterinar}"></td><td th:text="${x.datumCasVysetrenia}"></td><td th:text="${x.diagnoza}"></td><td th:text="${x.teplotaC}"></td><td th:text="${x.srdecnyTep}"></td><td th:text="${x.hmotnostKg}"></td><td th:text="${x.zavaznost}"></td><td><div class="actions"><a class="btn secondary" th:href="@{/vysetrenia/{id}/edit(id=${x.idVysetrenie})}">Upravit</a><form th:action="@{/vysetrenia/{id}/delete(id=${x.idVysetrenie})}" method="post"><button class="btn danger">Zmazat</button></form></div></td></tr>
</tbody></table></div></main></body></html>
