<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Vysetrenie</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header(${item == null ? 'Nove vysetrenie' : 'Upravit vysetrenie'})}"></div><main><div class="card"><form class="grid" method="post" th:action="${item == null} ? @{/vysetrenia} : @{/vysetrenia/{id}(id=${item.idVysetrenie})}">
<div class="field"><label>Zdravotna karta</label><select name="idZdravotnaKarta" required><option th:each="o:${karty}" th:value="${o.id}" th:text="${o.label}" th:selected="${item != null and item.idZdravotnaKarta == o.id}"></option></select></div><div class="field"><label>Veterinar</label><select name="idVeterinar" required><option th:each="o:${veterinari}" th:value="${o.id}" th:text="${o.label}" th:selected="${item != null and item.idVeterinar == o.id}"></option></select></div>
<div class="field"><label>Datum a cas</label><input type="datetime-local" name="datumCasVysetrenia" required th:value="${item?.datumCasVysetrenia}"></div><div class="field"><label>Zavaznost</label><input name="zavaznost" required th:value="${item?.zavaznost}"></div>
<div class="field full"><label>Diagnoza</label><textarea name="diagnoza" th:text="${item?.diagnoza}"></textarea></div><div class="field full"><label>Popis liecby</label><textarea name="popisLiecby" th:text="${item?.popisLiecby}"></textarea></div>
<div class="field"><label>Teplota C</label><input type="number" step="0.1" name="teplotaC" required th:value="${item?.teplotaC}"></div><div class="field"><label>Srdecny tep</label><input type="number" name="srdecnyTep" required th:value="${item?.srdecnyTep}"></div><div class="field"><label>Hmotnost kg</label><input type="number" step="0.01" name="hmotnostKg" required th:value="${item?.hmotnostKg}"></div>
<div class="form-actions"><button class="btn">Ulozit</button><a class="btn secondary" href="/vysetrenia">Spat</a></div></form></div></main></body></html>
