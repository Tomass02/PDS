<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Platba</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header(${item == null ? 'Nova platba' : 'Upravit platbu'})}"></div><main><div class="card"><form class="grid" method="post" th:action="${item == null} ? @{/platby} : @{/platby/{id}(id=${item.idPlatba})}">
<div class="field"><label>Faktura</label><select name="idFaktura" required><option th:each="o:${faktury}" th:value="${o.id}" th:text="${o.label}" th:selected="${item != null and item.idFaktura == o.id}"></option></select></div><div class="field"><label>Datum a cas platby</label><input type="datetime-local" name="datumCasPlatby" required th:value="${item?.datumCasPlatby}"></div>
<div class="field"><label>Suma</label><input type="number" step="0.01" name="suma" required th:value="${item?.suma}"></div><div class="field"><label>Sposob platby</label><input name="sposobPlatby" th:value="${item?.sposobPlatby}"></div><div class="field"><label>Variabilny symbol</label><input name="variabilnySymbol" th:value="${item?.variabilnySymbol}"></div>
<div class="form-actions"><button class="btn">Ulozit</button><a class="btn secondary" href="/platby">Spat</a></div></form></div></main></body></html>
