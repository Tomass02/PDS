<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Platby</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header('Platby')}"></div><main><p><a class="btn" href="/platby/new">Pridat platbu</a></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Faktura</th><th>Datum/cas</th><th>Suma</th><th>Sposob</th><th>Variabilny symbol</th><th>Akcie</th></tr></thead><tbody>
<tr th:each="x:${items}"><td th:text="${x.idPlatba}"></td><td th:text="${x.faktura}"></td><td th:text="${x.datumCasPlatby}"></td><td th:text="${x.suma}"></td><td th:text="${x.sposobPlatby}"></td><td th:text="${x.variabilnySymbol}"></td><td><div class="actions"><a class="btn secondary" th:href="@{/platby/{id}/edit(id=${x.idPlatba})}">Upravit</a><form th:action="@{/platby/{id}/delete(id=${x.idPlatba})}" method="post"><button class="btn danger">Zmazat</button></form></div></td></tr>
</tbody></table></div></main></body></html>
